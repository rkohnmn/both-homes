name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run logic tests
        run: npm test

      - name: Check static assets and module paths
        run: npm run check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser test tools
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run Chromium regressions
        run: python tests/browser_test.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ github.job }}
          path: test-results/
          retention-days: 7

      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp -R index.html guide.html 404.html .nojekyll assets css js _site/

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Add absolute canonical URLs, sitemap and robots.txt
        run: node scripts/seo.mjs --dir _site --base "${{ steps.pages.outputs.base_url }}"

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
