<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Both Homes</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="The requested Both Homes page could not be found.">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #faf6ef;
      color: #211c16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.55;
    }
    main { width: min(520px, 100%); }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 42px; color: #211c16; text-decoration: none; }
    .brand svg { width: 34px; height: 34px; }
    .brand span { font-family: Georgia, "Times New Roman", serif; font-size: 1.35rem; font-weight: 600; letter-spacing: -0.02em; }
    p.eyebrow { margin: 0 0 10px; color: #1c6b58; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { margin: 0 0 14px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.1rem, 7vw, 3rem); line-height: 1.08; letter-spacing: -0.025em; }
    p { margin: 0 0 24px; color: #5d5347; font-size: 0.95rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; }
    a.button { display: inline-flex; align-items: center; min-height: 42px; padding: 0 15px; border-radius: 10px; text-decoration: none; font-size: 0.86rem; font-weight: 650; }
    a.primary { background: #1c6b58; color: #fff; }
    a.secondary { border: 1px solid #cbbda8; background: #fffdf8; color: #211c16; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .fine { margin-top: 34px; color: #6f6557; font-size: 0.72rem; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="./index.html" aria-label="Both Homes home">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#1c6b58"/>
        <path d="M5.5 14.4 11 9.6l5.4 4.8M15.7 14.4 21 9.6l5.5 4.8M5.5 14.4V25h21V14.4M16 14.4V25" fill="none" stroke="#fffdf8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Both Homes</span>
    </a>

    <p class="eyebrow">404 · page not found</p>
    <h1>That page isn’t part of the plan.</h1>
    <p>The address may have changed, or the link may be incomplete. Your saved calendar is still in this browser.</p>
    <div class="actions">
      <a class="button primary" href="./index.html" data-home>Open the calendar</a>
      <a class="button secondary" href="./guide.html">Read the pattern guide</a>
    </div>
    <p class="fine">Both Homes is a planning tool, not legal advice.</p>
  </main>
  <script>
    // GitHub Pages project sites live under /<repository>/. Keep the home link
    // correct even when the missing URL is nested one level deeper.
    try {
      if (location.hostname.endsWith('.github.io')) {
        const repo = location.pathname.split('/')[1];
        if (repo) document.querySelector('[data-home]').href = `/${repo}/`;
      }
    } catch {}
  </script>
</body>
</html>
